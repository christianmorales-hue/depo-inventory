services:
  db:
    image: postgres:16
    container_name: depo-db
    environment:
      POSTGRES_USER: depo
      POSTGRES_PASSWORD: depo
      POSTGRES_DB: depo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - .:/work
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U depo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
